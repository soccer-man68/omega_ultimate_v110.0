<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OMEGA REGRESSION v110.0 Mobile</title>
  <!-- 엑셀(.xlsx) 파일 파싱 라이브러리 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-color: #020617;
      --card-bg: #0f172a;
      --header-bg: #1e1b4b;
      --accent-gold: #fbbf24;
      --accent-cyan: #38bdf8;
      --accent-purple: #7c3aed;
      --accent-green: #22c55e;
      --accent-rose: #f43f5e;
      --border-color: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    /* --- [보안 잠금 화면] --- */
    #lock-screen {
      position: fixed; inset: 0; background: #020617;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; padding: 20px;
    }
    .lock-box {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 30px 25px; width: 100%; max-width: 340px;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .lock-title { font-size: 22px; font-weight: bold; color: var(--accent-gold); margin-bottom: 8px; }
    .lock-sub { font-size: 13px; color: var(--accent-cyan); margin-bottom: 25px; }
    .pin-input {
      width: 100%; height: 50px; font-size: 24px; text-align: center; letter-spacing: 12px;
      background: #000; border: 2px solid var(--accent-purple); border-radius: 12px;
      color: #fff; outline: none; margin-bottom: 15px;
    }
    .pin-btn {
      width: 100%; height: 50px; background: var(--accent-purple); color: white;
      font-size: 16px; font-weight: bold; border: none; border-radius: 12px;
      cursor: pointer; transition: 0.2s;
    }
    .pin-btn:active { transform: scale(0.98); background: #6d28d9; }
    .err-msg { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }

    /* --- [메인 레이아웃] --- */
    #app-container { display: none; padding-bottom: 30px; }
    header { background: var(--header-bg); padding: 20px 15px; text-align: center; border-bottom: 2px solid #312e81; }
    header h1 { font-size: 22px; color: var(--accent-gold); font-weight: 900; letter-spacing: 0.5px; }
    header p { font-size: 12px; color: var(--accent-cyan); margin-top: 4px; font-family: monospace; }

    .main-wrap { max-width: 600px; margin: 0 auto; padding: 15px; }
    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 15px; margin-bottom: 15px;
    }

    /* 컨트롤 영역 */
    .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .file-btn {
      background: #1e3a8a; color: white; padding: 10px 16px; border-radius: 8px;
      font-size: 13px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center;
      border: none;
    }
    #excel-input { display: none; }
    .status-text { font-size: 13px; color: var(--text-muted); flex: 1; text-align: right; }

    .range-selector { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
    select {
      background: #000; color: #fff; border: 1px solid var(--border-color);
      padding: 6px 12px; border-radius: 6px; outline: none; font-size: 13px;
    }

    /* 실행 버튼 */
    .btn-action {
      width: 100%; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
      display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-regression { background: linear-gradient(135deg, #b45309, #d97706); color: #fff; padding: 15px; font-size: 15px; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3); }
    .btn-hunt { background: #7c3aed; color: #fff; padding: 15px; font-size: 15px; }
    .btn-stop { background: #4b5563 !important; }

    /* 프로그레스바 */
    .progress-bar-wrap {
      width: 100%; height: 8px; background: #000; border-radius: 4px; overflow: hidden; margin-bottom: 12px;
    }
    .progress-fill { width: 0%; height: 100%; background: var(--accent-cyan); transition: width 0.1s; }

    /* 결과 터미널 화면 */
    .terminal {
      background: #000; border: 1px solid var(--border-color); border-radius: 12px;
      padding: 15px; min-height: 280px; max-height: 500px; overflow-y: auto;
      font-family: "Consolas", -apple-system, monospace; font-size: 13px; line-height: 1.6;
    }
    .log-header { color: #f43f5e; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .log-info { color: var(--accent-cyan); }
    .log-target { color: var(--accent-gold); font-weight: bold; }
    .log-win { color: var(--accent-green); font-weight: bold; }
    .log-dna { color: #c084fc; font-weight: bold; }
    .log-subtext { color: #94a3b8; font-size: 12px; }
    .log-highlight { color: #38bdf8; font-weight: bold; }

    /* 로또 볼 스타일 뱃지 */
    .ball {
      display: inline-flex; justify-content: center; align-items: center;
      width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 12px;
      font-weight: bold; margin: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .b-yellow { background: #f59e0b; }
    .b-blue { background: #3b82f6; }
    .b-red { background: #ef4444; }
    .b-gray { background: #6b7280; }
    .b-green { background: #10b981; }

    .stat-badge {
      display: inline-block; background: #1e293b; border: 1px solid #475569;
      border-radius: 6px; padding: 2px 6px; font-size: 11px; color: #cbd5e1; margin-left: 4px;
    }
  </style>
</head>
<body>

  <!-- [잠금 화면 (PIN 4938)] -->
  <div id="lock-screen">
    <div class="lock-box">
      <div class="lock-title">OMEGA REGRESSION</div>
      <div class="lock-sub">회귀주기 엔진 v110.0 보안 인증</div>
      <input type="password" id="pin-field" class="pin-input" maxlength="4" placeholder="••••" pattern="[0-9]*" inputmode="numeric">
      <button class="pin-btn" onclick="checkPin()">인증 및 접속</button>
      <div id="err-text" class="err-msg">비밀번호가 일치하지 않습니다.</div>
    </div>
  </div>

  <!-- [메인 어플리케이션 화면] -->
  <div id="app-container">
    <header>
      <h1>OMEGA REGRESSION v110.0</h1>
      <p>Precision Periodicity & Regression Cycle Engine</p>
    </header>

    <div class="main-wrap">
      <!-- 데이터 로드 카드 -->
      <div class="card">
        <div class="ctrl-row">
          <label class="file-btn" for="excel-input">
            📁 데이터 파일(.xlsx) 선택
          </label>
          <input type="file" id="excel-input" accept=".xlsx, .xls">
          <div id="data-status" class="status-text">데이터 대기 중</div>
        </div>

        <div class="range-selector">
          <span>회귀 탐색 심도:</span>
          <select id="test-count">
            <option value="50">최근 50회차 분석</option>
            <option value="100" selected>최근 100회차 분석 (권장)</option>
            <option value="200">최근 200회차 분석</option>
          </select>
        </div>
      </div>

      <!-- 실행 버튼 영역 -->
      <button class="btn-action btn-regression" onclick="runRegressionAnalysis()">
        🔄 회귀주기 정밀 분석 (21수 풀 + 핵심 코어 3수)
      </button>

      <button id="hunt-btn" class="btn-action btn-hunt" onclick="toggleHunting()">
        🧬 회귀 공명 DNA 헌팅 (주기 백테스팅 최적화)
      </button>

      <!-- 프로그레스바 -->
      <div class="progress-bar-wrap">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <!-- 로그 결과 출력창 -->
      <div id="terminal" class="terminal">
        <div class="log-info">엑셀 데이터 파일을 등록한 후 [회귀주기 정밀 분석]을 실행하십시오.</div>
      </div>
    </div>
  </div>

  <script>
    // --- [1. 보안 PIN 인증] ---
    function checkPin() {
      const pin = document.getElementById("pin-field").value.trim();
      const err = document.getElementById("err-text");
      if (pin === "4938") {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("app-container").style.display = "block";
      } else {
        err.style.display = "block";
        document.getElementById("pin-field").value = "";
      }
    }
    document.getElementById("pin-field").addEventListener("keypress", (e) => {
      if (e.key === "Enter") checkPin();
    });

    // --- [2. 데이터 파일 로더] ---
    let processedAll = [];
    let isHunting = false;
    let stopHuntingFlag = false;

    document.getElementById("excel-input").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

          processedAll = [];
          for (let r of rows) {
            if (!r || r[0] == null || r[1] == null) continue;
            try {
              const drawNo = parseInt(r[0]);
              const mainNums = [r[1], r[2], r[3], r[4], r[5], r[6]].map(Number).sort((a,b)=>a-b);
              const bonusNum = parseInt(r[7] || 0);
              if (!isNaN(drawNo) && mainNums.length === 6 && !mainNums.some(isNaN)) {
                processedAll.push({ drawNo, mainNums, bonusNum });
              }
            } catch(e) {}
          }

          processedAll.sort((a,b) => a.drawNo - b.drawNo);
          if (processedAll.length > 0) {
            const lastRound = processedAll[processedAll.length - 1].drawNo;
            const statusLbl = document.getElementById("data-status");
            statusLbl.innerText = `로드 완료: ${lastRound}회 (${processedAll.length}개 회차)`;
            statusLbl.style.color = "#fbbf24";
            appendLog(`▶ 데이터 파일 로드 성공! 최근 회차: ${lastRound}회차`, "log-win");
          }
        } catch (err) {
          alert("파일 읽기 오류: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // --- [3. UI 및 시각화 유틸] ---
    const allNums = Array.from({length: 45}, (_, i) => i + 1);

    function appendLog(html, className = "") {
      const term = document.getElementById("terminal");
      const div = document.createElement("div");
      if (className) div.className = className;
      div.innerHTML = html;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;
    }

    function clearLog() {
      document.getElementById("terminal").innerHTML = "";
    }

    function getBallHtml(n) {
      let colorClass = "b-yellow";
      if (n >= 11 && n <= 20) colorClass = "b-blue";
      else if (n >= 21 && n <= 30) colorClass = "b-red";
      else if (n >= 31 && n <= 40) colorClass = "b-gray";
      else if (n >= 41) colorClass = "b-green";
      return `<span class="ball ${colorClass}">${n}</span>`;
    }

    function formatSet(nums) {
      return nums.map(n => getBallHtml(n)).join(" ");
    }

    // --- [4. 정밀 회귀주기 분석 엔진 (Regression Cycle Core)] ---

    // 특정 데이터셋 기준으로 1~45번의 회귀 통계 및 점수를 종합 분석
    function computeRegressionProfiles(dataset) {
      const totalDraws = dataset.length;
      const profiles = {};

      // 1. 번호별 출현 인덱스 추적
      for (let n of allNums) {
        profiles[n] = {
          num: n,
          indices: [],
          gaps: [],
          currentGap: 0,
          avgGap: 0,
          shortCycle: 0,
          timingIndex: 0,
          regressionResonance: 0,
          score: 0
        };
      }

      for (let idx = 0; idx < totalDraws; idx++) {
        const draw = dataset[idx].mainNums;
        for (let n of draw) {
          if (profiles[n]) profiles[n].indices.push(idx);
        }
      }

      // 2. 주기(Intervals) 및 미출현 갭(Current Gap) 산출
      for (let n of allNums) {
        const idxList = profiles[n].indices;
        if (idxList.length === 0) {
          profiles[n].currentGap = totalDraws;
          profiles[n].avgGap = totalDraws;
          profiles[n].shortCycle = totalDraws;
          continue;
        }

        // 현재 미출현 회차(Gap)
        profiles[n].currentGap = (totalDraws - 1) - idxList[idxList.length - 1];

        // 회차별 간격들
        const gaps = [];
        for (let i = 1; i < idxList.length; i++) {
          gaps.push(idxList[i] - idxList[i - 1]);
        }
        profiles[n].gaps = gaps;

        // 전체 평균 주기
        const avg = gaps.length > 0 ? (gaps.reduce((a,b)=>a+b, 0) / gaps.length) : 7.5;
        profiles[n].avgGap = avg;

        // 최근 3회 출현 단기 가중주기(WMA: 가중치 3, 2, 1)
        if (gaps.length >= 3) {
          const g1 = gaps[gaps.length - 1];
          const g2 = gaps[gaps.length - 2];
          const g3 = gaps[gaps.length - 3];
          profiles[n].shortCycle = (g1 * 3 + g2 * 2 + g3 * 1) / 6.0;
        } else if (gaps.length > 0) {
          profiles[n].shortCycle = gaps[gaps.length - 1];
        } else {
          profiles[n].shortCycle = avg;
        }

        // 3. [회귀 적시성 지수: Timing Readiness]
        // 현재 미출현 Gap이 단기/평균 회귀 주기에 도달했는지 정규분포(가우시안) 적합도 측정
        const targetCycle = (profiles[n].shortCycle * 0.65) + (profiles[n].avgGap * 0.35);
        const gap = profiles[n].currentGap;
        const diff = Math.abs(gap - targetCycle);

        // 주기에 정확히 도달하거나 1~2회 오차일 때 최대 점수
        let timingScore = 0;
        if (diff <= 1.5) timingScore = 50.0;
        else if (diff <= 3.0) timingScore = 38.0;
        else if (diff <= 5.0) timingScore = 24.0;
        else timingScore = Math.max(0, 15 - diff * 2);

        // 보너스: 2~4주차 황금 회귀 구간(직전 리바운드) 가산
        if (gap >= 2 && gap <= 4) timingScore += 18.0;
        // 보너스: 직전회차 이월 주기 (gap = 0)의 통계적 적중력 보존
        if (gap === 0) timingScore += 12.0;

        profiles[n].timingIndex = timingScore;
      }

      // 4. [다중 회귀선 공명 분석: Step Regression Resonance]
      // 3회귀, 5회귀, 7회귀, 10회귀, 14회귀 전 당첨번호와의 동조율 계산
      const stepIntervals = [3, 5, 7, 10, 14];
      const stepWeights = { 3: 15, 5: 18, 7: 16, 10: 14, 14: 12 };

      for (let step of stepIntervals) {
        const targetIdx = (totalDraws - 1) - (step - 1);
        if (targetIdx >= 0) {
          const pastDraw = dataset[targetIdx].mainNums;
          for (let n of pastDraw) {
            profiles[n].regressionResonance += stepWeights[step];
          }
        }
      }

      // 5. 종합 회귀 스코어 집계
      for (let n of allNums) {
        const p = profiles[n];
        // 최종 점수 = 회귀 적시성(Timing) + 회귀선 공명(Resonance) + 최근 안정성
        p.score = (p.timingIndex * 1.3) + (p.regressionResonance * 0.9);
      }

      return profiles;
    }

    // 21수 풀 및 핵심 코어 3수 도출
    function getRegressionPoolAndCores(dataset) {
      const profiles = computeRegressionProfiles(dataset);

      // 점수 내림차순 정렬
      const sortedList = Object.values(profiles).sort((a,b) => b.score - a.score);

      // 상위 21수 선별
      const pool21 = sortedList.slice(0, 21).map(p => p.num).sort((a,b) => a - b);

      // [핵심 코어 3수 선출 알고리즘]
      // 21수 중 점수가 최상위이면서, 번호대(단번대, 10대, 20대, 30대, 40대)가 겹치지 않게 분산 선택
      const topCandidates = sortedList.slice(0, 10);
      const cores = [];

      for (let item of topCandidates) {
        if (cores.length >= 3) break;
        const zone = Math.floor(item.num / 10);
        const existingZones = cores.map(c => Math.floor(c / 10));
        
        // 동일 번호대에 2개 이상 몰리지 않도록 조정
        if (!existingZones.includes(zone) || cores.length === 2) {
          cores.push(item.num);
        }
      }

      // 3수가 안 채워졌다면 점수 순 추가
      for (let item of topCandidates) {
        if (cores.length >= 3) break;
        if (!cores.includes(item.num)) cores.push(item.num);
      }

      cores.sort((a,b) => a - b);

      return {
        pool21,
        cores,
        profiles
      };
    }

    // --- [5. 최종 조합 스마트 필터링] ---
    function generateRegressionCombinations(pool, cores, count = 5) {
      const finalSets = [];
      let attempts = 0;

      while (finalSets.length < count && attempts < 3500) {
        attempts++;
        // 코어수 중 1~2수 필수 고정 배치
        const pickCoreCount = Math.random() < 0.65 ? 1 : 2;
        const shuffledCores = [...cores].sort(() => 0.5 - Math.random());
        const base = shuffledCores.slice(0, pickCoreCount);

        const remainPool = pool.filter(n => !base.includes(n)).sort(() => 0.5 - Math.random());
        const combo = [...base, ...remainPool.slice(0, 6 - base.length)].sort((a,b) => a - b);

        // 총합 필터 (100 ~ 175)
        const sum = combo.reduce((a,b) => a + b, 0);
        if (sum < 100 || sum > 175) continue;

        // 홀짝 비율 필터 (2:4, 3:3, 4:2)
        const oddCnt = combo.filter(n => n % 2 !== 0).length;
        if (![2, 3, 4].includes(oddCnt)) continue;

        // 고저 비율 (1~22 vs 23~45)
        const lowCnt = combo.filter(n => n <= 22).length;
        if (lowCnt < 2 || lowCnt > 4) continue;

        // 연속 번호 3개 이상 배제
        let consecutive = 0;
        let hasTriple = false;
        for (let i = 0; i < combo.length - 1; i++) {
          if (combo[i+1] - combo[i] === 1) {
            consecutive++;
            if (consecutive >= 2) { hasTriple = true; break; }
          } else {
            consecutive = 0;
          }
        }
        if (hasTriple) continue;

        const key = combo.join(",");
        if (!finalSets.some(s => s.join(",") === key)) {
          finalSets.push(combo);
        }
      }

      while (finalSets.length < count) {
        const fallback = [...pool].sort(() => 0.5 - Math.random()).slice(0, 6).sort((a,b) => a - b);
        finalSets.push(fallback);
      }

      return finalSets;
    }

    // --- [6. 실행 핸들러] ---

    // 🔄 회귀주기 정밀 분석 실행
    function runRegressionAnalysis() {
      if (processedAll.length === 0) {
        alert("엑셀 데이터 파일을 먼저 선택해주세요.");
        return;
      }
      clearLog();

      const lastDraw = processedAll[processedAll.length - 1].drawNo;
      const nextDraw = lastDraw + 1;

      appendLog(`=== [OMEGA 회귀주기 정밀 분석 엔진] ===`, "log-header");
      appendLog(`▶ 데이터베이스: 누적 ${lastDraw}회차 (기준)`, "log-info");
      appendLog(`▶ 1~45번 고유 회귀주기(Interval Gap) 및 단기 WMA 주기 매칭 중...`, "log-subtext");

      setTimeout(() => {
        const { pool21, cores, profiles } = getRegressionPoolAndCores(processedAll);

        appendLog(`▶ [분석 완료] ${nextDraw}회차 최적 주기 도래수 21개 산출 성공`, "log-win");
        appendLog(`▶ <b>회귀 추천 21수 풀:</b>`, "log-info");
        appendLog(`&nbsp;&nbsp;[ ${pool21.join(", ")} ]`);

        // 코어 3수 주기 데이터 요약 표시
        appendLog(`<br>▶ <b>★ 회귀 최우선 핵심 코어 3수 ★</b>`, "log-target");
        appendLog(`&nbsp;&nbsp;${formatSet(cores)}`);
        
        cores.forEach(c => {
          const prof = profiles[c];
          appendLog(`&nbsp;&nbsp;• <b>${c}번</b>: 미출현 ${prof.currentGap}주기 | 평균주기 ${prof.avgGap.toFixed(1)}주 | 회귀공명점수 ${prof.score.toFixed(1)}점`, "log-subtext");
        });

        // 5개 완성 조합 생성
        const combinations = generateRegressionCombinations(pool21, cores, 5);

        appendLog(`<br>========================================`, "log-subtext");
        appendLog(`★ <b>[${nextDraw}회차 회귀주기 기반 최종 5개 조합]</b> ★`, "log-target");
        appendLog(`========================================`, "log-subtext");

        combinations.forEach((c, idx) => {
          appendLog(`조합 ${idx + 1}: ${formatSet(c)} <span class="stat-badge">합:${c.reduce((a,b)=>a+b,0)}</span>`);
        });

        // 프로그레스바 채우기
        document.getElementById("progress-fill").style.width = "100%";
      }, 80);
    }

    // 🧬 회귀 공명 DNA 헌팅 (백테스팅 최적화)
    async function toggleHunting() {
      if (processedAll.length === 0) {
        alert("엑셀 데이터 파일을 먼저 선택해주세요.");
        return;
      }

      const huntBtn = document.getElementById("hunt-btn");
      if (isHunting) {
        stopHuntingFlag = true;
        huntBtn.innerText = "🧬 회귀 공명 DNA 헌팅";
        huntBtn.classList.remove("btn-stop");
        isHunting = false;
        return;
      }

      isHunting = true;
      stopHuntingFlag = false;
      huntBtn.innerText = "🛑 헌팅 중지";
      huntBtn.classList.add("btn-stop");

      const numTest = parseInt(document.getElementById("test-count").value);
      const totalLen = processedAll.length;
      const startIdx = Math.max(30, totalLen - numTest);

      clearLog();
      appendLog(`=== [회귀주기 백테스팅 및 공명 DNA 탐색] ===`, "log-header");
      appendLog(`▶ 과거 ${numTest}개 회차에 회귀 모델을 투영하여 적중 주기를 검증합니다.`, "log-info");

      let hitCounts = { 3: 0, 4: 0, 5: 0, 6: 0 };
      let qualifiedRounds = [];

      for (let i = startIdx; i < totalLen; i++) {
        if (stopHuntingFlag) break;

        const targetRn = processedAll[i].drawNo;
        const targetMain = new Set(processedAll[i].mainNums);
        const subData = processedAll.slice(0, i);

        const { pool21 } = getRegressionPoolAndCores(subData);
        const hits = pool21.filter(n => targetMain.has(n)).length;

        if (hits >= 5) {
          hitCounts[hits] = (hitCounts[hits] || 0) + 1;
          qualifiedRounds.push(targetRn);
          appendLog(`[${targetRn}회차] 21수 중 <span class="log-win">${hits}개 적중!</span> (회귀 주기 완벽 일치)`, "log-dna");
        } else if (hits === 4) {
          hitCounts[4] = (hitCounts[4] || 0) + 1;
        }

        const pct = ((i - startIdx + 1) / (totalLen - startIdx)) * 100;
        document.getElementById("progress-fill").style.width = `${pct}%`;
        await new Promise(r => setTimeout(r, 15));
      }

      if (!stopHuntingFlag) {
        const nextDraw = processedAll[processedAll.length - 1].drawNo + 1;
        appendLog(`<br>▶ <b>백테스팅 완료:</b> 5적중 이상 회차 = ${qualifiedRounds.length}회, 4적중 = ${hitCounts[4]}회`, "log-win");
        
        // 현재 시점 최종 회귀 풀 추출
        const { pool21, cores } = getRegressionPoolAndCores(processedAll);
        appendLog(`▶ <b>[${nextDraw}회차 최적화 회귀 21수]:</b> [ ${pool21.join(", ")} ]`, "log-info");
        appendLog(`▶ <b>[${nextDraw}회차 최적화 코어 3수]:</b> ${formatSet(cores)}`, "log-target");

        const sets = generateRegressionCombinations(pool21, cores, 5);
        appendLog(`<br>★ <b>[공명 헌팅 최적 조합 5세트]</b> ★`, "log-target");
        sets.forEach((s, idx) => {
          appendLog(`조합 ${idx + 1}: ${formatSet(s)}`);
        });
      }

      huntBtn.innerText = "🧬 회귀 공명 DNA 헌팅 (주기 백테스팅 최적화)";
      huntBtn.classList.remove("btn-stop");
      isHunting = false;
    }
  </script>
